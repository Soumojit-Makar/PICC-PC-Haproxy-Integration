name: Build & Publish CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Validate, Test & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Validate Maven POM
        run: mvn validate
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compile and Test
        run: mvn clean test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run SAST Security Scans (SpotBugs)
        run: mvn spotbugs:check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Vulnerability Scans (OWASP Dependency-Check)
        run: mvn dependency-check:check
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM
        run: mvn cyclonedx:makeAggregateBom
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    name: Publish Artifacts to GitHub Packages
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Deploy to GitHub Packages
        run: mvn clean deploy -Pgithub-packages -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
