name: Build & Publish CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Validate, Test & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven POM
        run: mvn validate

      - name: Compile and Test
        run: mvn clean test

      - name: Run SAST Security Scans (SpotBugs)
        run: mvn spotbugs:check

      - name: Run Vulnerability Scans (OWASP Dependency-Check)
        run: mvn dependency-check:check

      - name: Generate CycloneDX SBOM
        run: mvn cyclonedx:makeAggregateBom

  publish:
    name: Publish Artifacts to GitHub Packages
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Deploy to GitHub Packages
        run: mvn clean deploy -Pgithub-packages -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
