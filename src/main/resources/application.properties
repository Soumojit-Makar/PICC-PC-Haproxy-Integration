# ==============================================================================
# PICC-PC-Haproxy-Integration - Application Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8081}
spring.application.name=haproxy-int

# Active Profile (Override via SPRING_PROFILES_ACTIVE=dev | main | local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:main}

# Spring Cloud Config Label
spring.cloud.config.label=${CONFIG_LABEL:v1}

# Optional Centralized Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}/nnp-config

# ------------------------------------------------------------------------------
# HAProxy DataPlane API v3 Integration
# ------------------------------------------------------------------------------
haproxy.feign.name=${HAPROXY_FEIGN_NAME:haproxy-data-plane}
haproxy.feign.url=${HAPROXY_DATAPLANE_URL:http://localhost:5555}
feign.url.api=${FEIGN_URL_API:/v3/services/haproxy}
haproxy.dataplane.user=${HAPROXY_DATAPLANE_USER:dataplaneapi}
haproxy.dataplane.password=${HAPROXY_DATAPLANE_PASSWORD:}

# ------------------------------------------------------------------------------
# Kubernetes API Integration (Pre-Registration Pod Validation)
# ------------------------------------------------------------------------------
k8s.master.ip=${K8S_MASTER_IP:127.0.0.1}
k8s.server.port=${K8S_SERVER_PORT:6443}
k8s.cluster.token=${K8S_CLUSTER_TOKEN:}
haproxy.k8s.validation.enabled=${HAPROXY_K8S_VALIDATION_ENABLED:true}
haproxy.k8s.strict-mode=${HAPROXY_K8S_STRICT_MODE:false}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# ------------------------------------------------------------------------------
# Actuator & Observability
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.env.show-values=NEVER
management.endpoint.configprops.show-values=NEVER

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.nnp.haproxy=${LOG_LEVEL:INFO}
logging.level.feign=${FEIGN_LOG_LEVEL:WARN}
